# 单元测试 —— push / PR 时自动跑。
#
# 这些测试是纯逻辑的（URL 抠取、平台识别、报错翻译），不联网、不需要
# yt-dlp/ffmpeg，所以几秒钟就能跑完。真实的平台可用性由 smoke.yml 负责。

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 单元测试本身只依赖标准库 + pytest，故意不装 requests/playwright，
      # 保证「测试失败 = 代码问题」而不是「依赖装不上」。
      #
      # 但 yt-dlp 必须装：内置 yt-dlp 是核心功能，TestBundledYtdlp 直接
      # 断言 `import yt_dlp` 可用、且 YTDLP_CMD 走「当前解释器 -m yt_dlp」。
      # 不装它这 4 项必红（曾漏装过，本地用干净环境模拟 runner 复现：
      # 4 failed, 57 passed）。yt-dlp 只有约 3 MB，不违背上面那条原则。
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest yt-dlp

      - name: Run unit tests
        run: pytest -q
        env:
          PYTHONUTF8: "1"
