# 单元测试 —— push / PR 时自动跑。
#
# 这些测试是纯逻辑的（URL 抠取、平台识别、报错翻译），不联网、不需要
# yt-dlp/ffmpeg，所以几秒钟就能跑完。真实的平台可用性由 smoke.yml 负责。

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 单元测试只依赖标准库 + pytest，故意不装 requests/playwright，
      # 保证「测试失败 = 代码问题」而不是「依赖装不上」。
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run unit tests
        run: pytest -q
        env:
          PYTHONUTF8: "1"
