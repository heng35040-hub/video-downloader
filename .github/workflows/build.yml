# Build and Release Windows Executable
#
# Triggers:
#   - Push tag matching v* (e.g., v2026.10.15)
#   - Manual workflow_dispatch
#
# Outputs (两种形态，见 build.spec 顶部说明):
#   - VideoDownloader-win64.zip   解压后双击里面的 exe，启动 1–3 秒（主推）
#   - dist/VideoDownloader.exe    单文件，双击即用，但每次启动约 30 秒（备选）
#   - SHA256SUMS.txt
#   - Auto-publishes to GitHub Releases

name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v2026.10.15)"
        required: true
        type: string

permissions:
  contents: write  # For creating releases

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        # 不跑 `playwright install chromium`：浏览器不会被打进包，装了也没用
        # （只落在 runner 的 %LOCALAPPDATA%\ms-playwright）。抖音在用户机器上
        # 直接使用系统自带的 Edge/Chrome，见 douyin.py 的 _BROWSER_CHANNELS。
        # 这里只需要 playwright 的 Python 包本身，它自带的 PyInstaller hook
        # （entry point pyinstaller40）会把 node 驱动收进包里。
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: |
          pip install pytest
          pytest -q
        env:
          PYTHONUTF8: "1"

      - name: Verify source compiles
        run: |
          python -m py_compile main.py config.py backends.py douyin.py kuaishou.py procutil.py errors.py toolssetup.py smoke_test.py
          echo "All source files compile OK"

      # ---------- 主推产物：onedir，打成 zip ----------
      - name: Build onedir (primary)
        env:
          VD_BUILD_MODE: onedir
        run: |
          pyinstaller --clean build.spec
          ls -la dist/VideoDownloader/VideoDownloader.exe

      # 关键一步：真正跑一遍冻结产物。PyInstaller 漏收 playwright 驱动或
      # tkinterdnd2 原生库时，构建照样"成功"，只有启动自检才会暴露。
      - name: Self-test onedir build
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest-onedir.txt"
          & .\dist\VideoDownloader\VideoDownloader.exe --selftest --selftest-out $out
          $code = $LASTEXITCODE
          Get-Content $out
          if ($code -ne 0) { throw "onedir 自检失败（退出码 $code）" }

      - name: Package onedir into zip
        run: |
          powershell -Command "Compress-Archive -Path 'dist\VideoDownloader' -DestinationPath 'VideoDownloader-win64.zip' -Force"
          ls -lh VideoDownloader-win64.zip

      # ---------- 备选产物：单文件 exe ----------
      # 放在 zip 打包之后构建：--clean/--noconfirm 可能会清掉 dist 目录。
      - name: Build onefile (optional single-file)
        env:
          VD_BUILD_MODE: onefile
        run: |
          pyinstaller --clean build.spec
          ls -la dist/VideoDownloader.exe

      - name: Self-test onefile build
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest-onefile.txt"
          & .\dist\VideoDownloader.exe --selftest --selftest-out $out
          $code = $LASTEXITCODE
          Get-Content $out
          if ($code -ne 0) { throw "onefile 自检失败（退出码 $code）" }

      - name: Generate SHA256 checksums
        run: |
          certutil -hashfile dist\VideoDownloader.exe SHA256 > SHA256SUMS.txt
          certutil -hashfile VideoDownloader-win64.zip SHA256 >> SHA256SUMS.txt
          type SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Video Downloader ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Video Downloader ${{ github.ref_name }}

            ### 下载

            **推荐：`VideoDownloader-win64.zip`**
            下载后解压，双击文件夹里的 `VideoDownloader.exe` 即可，**启动 1–3 秒**。

            **备选：`VideoDownloader.exe`**
            单文件，下载后直接双击，不用解压；但每次启动都要先把自身解压到
            临时目录，实测**约 35 秒**（且更容易被杀软误报）。适合只想拿一个文件的场景。

            两种形态功能完全相同，都不需要安装 Python。

            ### 校验完整性
            ```powershell
            certutil -hashfile VideoDownloader-win64.zip SHA256
            ```
            与下方 SHA256SUMS.txt 中的记录比对。

            ### 运行要求
            - Windows 10/11 (64-bit)
            - 下载被墙平台 (YouTube/X/Instagram/TikTok) 需本机代理软件运行
            - 抖音功能使用系统自带的 Microsoft Edge / Google Chrome，无需额外下载浏览器
            - 首次启动会自动下载 yt-dlp 和 ffmpeg 到 `%LOCALAPPDATA%\VideoDownloader\tools\`

            ### 变更日志
            见 [CHANGELOG.md](https://github.com/heng35040-hub/video-downloader/blob/main/CHANGELOG.md) 或提交历史。

          files: |
            VideoDownloader-win64.zip
            dist/VideoDownloader.exe
            SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: false

      - name: Upload artifacts (for manual trigger)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: VideoDownloader-win64
          path: |
            VideoDownloader-win64.zip
            dist/VideoDownloader.exe
            SHA256SUMS.txt
          retention-days: 7
