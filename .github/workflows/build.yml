# Build and Release Windows Executable
#
# Triggers:
#   - Push tag matching v* (e.g., v2026.10.16) —— 常规发布路径
#   - Manual workflow_dispatch —— 手动发布/补发布：填一个版本标签（如 v2026.10.16），
#     会用当前分支构建并把 exe 挂到该标签的 Release 上；标签不存在会自动创建，
#     Release 已存在则更新其附件。这是在网页上手动建了 Release、漏挂 exe 时的补救入口。
#
# Outputs:
#   - dist/VideoDownloader.exe   单文件，双击即用，无需解压（唯一发布形态）
#   - VideoDownloader-win64.zip  同一个 exe 的压缩包，仅便于转发
#   - SHA256SUMS.txt
#   - Auto-publishes to GitHub Releases

name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本标签，例如 v2026.10.16（不存在则自动创建）"
        required: true
        type: string

permissions:
  contents: write  # For creating releases

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    timeout-minutes: 30

    # Windows runner 的 run: 默认就是 pwsh，这里显式声明一遍。
    # 注意：**不要**在 run: 里写 bash 语法（ls -la、&&、$VAR 等）——
    # 曾经因为写了 `ls -la` 被 PowerShell 当成 Get-ChildItem -la 而整步失败，
    # 而 PyInstaller 其实已经构建成功了，排查了很久。
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        # 不跑 `playwright install chromium`：浏览器不会被打进包，装了也没用
        # （只落在 runner 的 %LOCALAPPDATA%\ms-playwright）。抖音在用户机器上
        # 直接使用系统自带的 Edge/Chrome，见 douyin.py 的 _BROWSER_CHANNELS。
        # 这里只需要 playwright 的 Python 包本身，它自带的 PyInstaller hook
        # （entry point pyinstaller40）会把 node 驱动收进包里。
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: |
          pip install pytest
          pytest -q
        env:
          PYTHONUTF8: "1"

      - name: Verify source compiles
        run: |
          python -m py_compile main.py config.py backends.py douyin.py kuaishou.py procutil.py errors.py toolssetup.py smoke_test.py
          Write-Host "All source files compile OK"

      - name: Build with PyInstaller (onefile)
        run: |
          pyinstaller --clean build.spec
          Get-Item dist\VideoDownloader.exe | Format-List Name,Length,LastWriteTime

      # 关键一步：真正跑一遍冻结产物。PyInstaller 漏收 playwright 驱动或
      # tkinterdnd2 原生库时，构建照样"成功"，只有启动自检才会暴露。
      - name: Self-test the frozen executable
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          if (Test-Path $out) { Remove-Item $out -Force }

          # 这是 windowed（console=False）exe：PowerShell 用 `&` 调用**不会等待**，
          # 会立刻返回且 $LASTEXITCODE 为 $null（实测 7ms 返回），
          # 于是 `$null -ne 0` 恒真、误判为失败。必须用 ProcessStartInfo + WaitForExit。
          # 也别用 Start-Process -NoNewWindow：PS 5.1 在环境变量存在大小写重复键
          # （HTTPS_PROXY / https_proxy）时会抛"已添加项"。
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Resolve-Path ".\dist\VideoDownloader.exe").Path
          $psi.Arguments = "--selftest --selftest-out `"$out`""
          $psi.UseShellExecute = $false
          $p = [System.Diagnostics.Process]::Start($psi)
          if (-not $p.WaitForExit(180000)) { throw "冻结产物自检超时（180 秒）" }

          if (-not (Test-Path $out)) { throw "自检没有生成报告文件：$out" }
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "冻结产物自检失败（退出码 $($p.ExitCode)）" }
          if (-not (Select-String -Path $out -Pattern 'RESULT: PASS' -Quiet)) { throw "自检报告不是 PASS" }

      # zip 只是为了网页下载/转发方便，真正的产物是 exe 本身，
      # 所以下面会同时把 exe 挂到 Release 上。
      - name: Package release zip
        run: |
          Compress-Archive -Path 'dist\VideoDownloader.exe' -DestinationPath 'VideoDownloader-win64.zip' -Force
          Get-Item VideoDownloader-win64.zip | Format-List Name,Length

      - name: Generate SHA256 checksums
        run: |
          certutil -hashfile dist\VideoDownloader.exe SHA256 > SHA256SUMS.txt
          certutil -hashfile VideoDownloader-win64.zip SHA256 >> SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Create Release
        # 两种触发方式都要能发布：推 tag 时用 tag 名，手动触发时用填的版本号
        # （标签不存在会由 action-gh-release 自动创建；Release 已存在则更新附件）。
        uses: softprops/action-gh-release@v2
        with:
          name: Video Downloader ${{ inputs.version || github.ref_name }}
          tag_name: ${{ inputs.version || github.ref_name }}
          body: |
            ## Video Downloader ${{ inputs.version || github.ref_name }}

            ### 下载
            - **VideoDownloader.exe** — 单文件便携版，**下载后双击即用**，
              无需安装、无需解压、无需 Python 环境

            `VideoDownloader-win64.zip` 是同一个文件的压缩包，仅便于转发。

            ### 校验完整性
            ```powershell
            certutil -hashfile VideoDownloader.exe SHA256
            ```
            与下方 SHA256SUMS.txt 中的记录比对。

            ### 启动耗时
            单文件程序每次启动时，引导程序都会先把自身内容解压到临时目录，
            实测约 3–5 秒（不只是第一次），这是正常现象。

            ### 运行要求
            - Windows 10/11 (64-bit)
            - 下载被墙平台 (YouTube/X/Instagram/TikTok) 需本机代理软件运行
            - 抖音功能使用系统自带的 Microsoft Edge / Google Chrome，无需额外下载浏览器
            - 首次启动会自动下载 yt-dlp 和 ffmpeg 到 `%LOCALAPPDATA%\VideoDownloader\tools\`

            ### 变更日志
            见 [CHANGELOG.md](https://github.com/heng35040-hub/video-downloader/blob/main/CHANGELOG.md) 或提交历史。

          files: |
            dist/VideoDownloader.exe
            VideoDownloader-win64.zip
            SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: false

      - name: Upload artifacts (for manual trigger)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: VideoDownloader-win64
          path: |
            dist/VideoDownloader.exe
            VideoDownloader-win64.zip
            SHA256SUMS.txt
          retention-days: 7
